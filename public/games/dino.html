<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dino Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand { font-size: 20px; font-weight: 800; color: #f59e0b; }
    .scores {
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .canvas-wrap {
      position: relative;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
      background: #0f172a;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .title { font-size: 28px; font-weight: 800; color: #f59e0b; }
    .btn {
      background: #f59e0b;
      color: #78350f;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #d97706; color: white; }
    .tip {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand">DINO RUNNER</div>
    <div class="scores">
      HI <span id="hi-score" style="color: #cbd5e1;">00000</span> · <span id="score" style="color: #f59e0b;">00000</span>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="500" height="220"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="overlay-msg">DINO RUNNER</div>
      <p style="font-size: 13px; color: #94a3b8;">Jump over cacti and survive!</p>
      <button class="btn" id="start-btn">Press Space or Tap to Jump</button>
    </div>
  </div>

  <div class="tip">Spacebar / Up Arrow or Tap anywhere on canvas to Jump</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hiScoreEl = document.getElementById('hi-score');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    let hi = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    hiScoreEl.textContent = String(hi).padStart(5, '0');

    let dino = { x: 40, y: 140, w: 26, h: 36, vy: 0, gravity: 0.65, jump: -11, grounded: true };
    let obstacles = [];
    let clouds = [{ x: 120, y: 40, s: 0.6 }, { x: 340, y: 30, s: 0.8 }, { x: 460, y: 55, s: 0.5 }];
    let score = 0;
    let speed = 4.5;
    let isPlaying = false;
    let animId = null;
    let frame = 0;

    function initGame() {
      dino.y = 140;
      dino.vy = 0;
      dino.grounded = true;
      obstacles = [];
      score = 0;
      speed = 4.5;
      frame = 0;
      overlay.classList.add('hidden');
      isPlaying = true;
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    function jump() {
      if (!isPlaying) {
        initGame();
        return;
      }
      if (dino.grounded) {
        dino.vy = dino.jump;
        dino.grounded = false;
      }
    }

    function loop() {
      frame++;
      update();
      draw();
      if (isPlaying) animId = requestAnimationFrame(loop);
    }

    function update() {
      // Score ramping
      if (frame % 5 === 0) {
        score++;
        scoreEl.textContent = String(score).padStart(5, '0');
        if (score > hi) {
          hi = score;
          hiScoreEl.textContent = String(hi).padStart(5, '0');
          localStorage.setItem('dino_hi', hi);
        }
        if (score % 100 === 0 && speed < 9) {
          speed += 0.3;
        }
      }

      // Dino physics
      dino.vy += dino.gravity;
      dino.y += dino.vy;
      if (dino.y >= 140) {
        dino.y = 140;
        dino.vy = 0;
        dino.grounded = true;
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= c.s;
        if (c.x < -60) c.x = canvas.width + 20;
      });

      // Spawn obstacles
      if (frame % Math.floor(90 / (speed / 4)) === 0 && Math.random() > 0.3) {
        const h = Math.random() > 0.5 ? 32 : 24;
        obstacles.push({
          x: canvas.width,
          y: 176 - h,
          w: 16,
          h: h
        });
      }

      // Move obstacles
      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision
        if (
          dino.x + 4 < obs.x + obs.w &&
          dino.x + dino.w - 4 > obs.x &&
          dino.y + 4 < obs.y + obs.h &&
          dino.y + dino.h > obs.y
        ) {
          gameOver();
          return;
        }
      }

      obstacles = obstacles.filter(o => o.x > -30);
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#334155';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.arc(c.x + 12, c.y - 6, 12, 0, Math.PI * 2);
        ctx.arc(c.x + 24, c.y, 10, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 176);
      ctx.lineTo(canvas.width, 176);
      ctx.stroke();

      // Dino
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
      // Dino eye
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(dino.x + 18, dino.y + 6, 3, 3);

      // Obstacles (Cacti)
      ctx.fillStyle = '#ef4444';
      obstacles.forEach(o => {
        ctx.fillRect(o.x, o.y, o.w, o.h);
        // arms
        ctx.fillRect(o.x - 4, o.y + 8, 4, 8);
        ctx.fillRect(o.x + o.w, o.y + 12, 4, 8);
      });
    }

    function gameOver() {
      isPlaying = false;
      overlayMsg.textContent = 'GAME OVER';
      startBtn.textContent = 'Restart Run';
      overlay.classList.remove('hidden');
    }

    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      jump();
    });

    startBtn.addEventListener('click', initGame);
    draw();
  </script>
</body>
</html>
