<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetramino Blocks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .board-wrap {
      position: relative;
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
      overflow: hidden;
    }
    canvas { display: block; }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 120px;
    }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .box-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .box-val {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }
    .mini-canvas {
      background: #0f172a;
      border-radius: 4px;
      margin-top: 4px;
      display: block;
      margin-inline: auto;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    .btn:hover { background: #0369a1; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay-title { font-size: 24px; font-weight: 800; color: #38bdf8; }
    .controls-help {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }
    .mobile-controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 360px;
    }
    .mbtn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 10px 0;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .mbtn:active { background: #334155; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="board-wrap">
      <canvas id="board" width="240" height="480"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlay-msg">TETRAMINO</div>
        <button class="btn" id="start-btn" style="width: auto; padding: 8px 24px;">Start Game</button>
      </div>
    </div>

    <div class="side-panel">
      <div class="box">
        <div class="box-title">Score</div>
        <div class="box-val" id="score">0</div>
      </div>
      <div class="box">
        <div class="box-title">Lines</div>
        <div class="box-val" id="lines">0</div>
      </div>
      <div class="box">
        <div class="box-title">Next</div>
        <canvas class="mini-canvas" id="next-canvas" width="80" height="80"></canvas>
      </div>
      <button class="btn" id="restart-btn">Restart</button>
    </div>
  </div>

  <div class="mobile-controls">
    <button class="mbtn" id="m-left">◀</button>
    <button class="mbtn" id="m-rot">⟳ Rotate</button>
    <button class="mbtn" id="m-right">▶</button>
    <button class="mbtn" id="m-drop">▼ Drop</button>
  </div>

  <div class="controls-help">
    Arrows: Move/Rotate · Up: Rotate · Down: Soft Drop · Space: Hard Drop
  </div>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 24;

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    const PIECES = [
      { shape: [[1, 1, 1, 1]], color: '#06b6d4' }, // I
      { shape: [[1, 1], [1, 1]], color: '#eab308' }, // O
      { shape: [[0, 1, 0], [1, 1, 1]], color: '#a855f7' }, // T
      { shape: [[1, 0, 0], [1, 1, 1]], color: '#3b82f6' }, // J
      { shape: [[0, 0, 1], [1, 1, 1]], color: '#f97316' }, // L
      { shape: [[0, 1, 1], [1, 1, 0]], color: '#22c55e' }, // S
      { shape: [[1, 1, 0], [0, 1, 1]], color: '#ef4444' }  // Z
    ];

    let grid = [];
    let currentPiece = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let dropInterval = 800;
    let lastDropTime = 0;
    let isGameOver = false;
    let isPlaying = false;
    let animId = null;

    function resetGrid() {
      grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
    }

    function getRandomPiece() {
      const idx = Math.floor(Math.random() * PIECES.length);
      const p = PIECES[idx];
      return {
        shape: p.shape.map(row => [...row]),
        color: p.color,
        x: Math.floor(COLS / 2) - Math.floor(p.shape[0].length / 2),
        y: 0
      };
    }

    function startGame() {
      resetGrid();
      score = 0;
      lines = 0;
      scoreEl.textContent = '0';
      linesEl.textContent = '0';
      dropInterval = 800;
      isGameOver = false;
      isPlaying = true;
      currentPiece = getRandomPiece();
      nextPiece = getRandomPiece();
      overlay.classList.add('hidden');
      lastDropTime = performance.now();
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(gameLoop);
      drawNext();
    }

    function collide(piece, offsetX = 0, offsetY = 0) {
      for (let r = 0; r < piece.shape.length; r++) {
        for (let c = 0; c < piece.shape[r].length; c++) {
          if (piece.shape[r][c]) {
            const newX = piece.x + c + offsetX;
            const newY = piece.y + r + offsetY;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && grid[newY][newX]) return true;
          }
        }
      }
      return false;
    }

    function rotatePiece(piece) {
      const rotated = piece.shape[0].map((_, index) => piece.shape.map(row => row[index]).reverse());
      const oldShape = piece.shape;
      piece.shape = rotated;
      if (collide(piece)) {
        if (!collide(piece, -1, 0)) { piece.x -= 1; }
        else if (!collide(piece, 1, 0)) { piece.x += 1; }
        else { piece.shape = oldShape; }
      }
    }

    function merge(piece) {
      for (let r = 0; r < piece.shape.length; r++) {
        for (let c = 0; c < piece.shape[r].length; c++) {
          if (piece.shape[r][c]) {
            if (piece.y + r < 0) {
              triggerGameOver();
              return;
            }
            grid[piece.y + r][piece.x + c] = piece.color;
          }
        }
      }
      clearLines();
      currentPiece = nextPiece;
      nextPiece = getRandomPiece();
      drawNext();
      if (collide(currentPiece)) {
        triggerGameOver();
      }
    }

    function clearLines() {
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(cell => cell !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          cleared++;
          r++; // re-check row
        }
      }
      if (cleared > 0) {
        lines += cleared;
        const lineScores = [0, 100, 300, 500, 800];
        score += (lineScores[cleared] || 800);
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        dropInterval = Math.max(150, 800 - lines * 25);
      }
    }

    function hardDrop() {
      if (!isPlaying || isGameOver) return;
      while (!collide(currentPiece, 0, 1)) {
        currentPiece.y++;
        score += 2;
      }
      scoreEl.textContent = score;
      merge(currentPiece);
    }

    function triggerGameOver() {
      isGameOver = true;
      isPlaying = false;
      overlayMsg.textContent = 'GAME OVER';
      overlay.classList.remove('hidden');
    }

    function gameLoop(time) {
      if (!isPlaying || isGameOver) return;
      if (time - lastDropTime > dropInterval) {
        if (!collide(currentPiece, 0, 1)) {
          currentPiece.y++;
        } else {
          merge(currentPiece);
        }
        lastDropTime = time;
      }
      draw();
      animId = requestAnimationFrame(gameLoop);
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= canvas.width; x += BLOCK) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += BLOCK) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw locked blocks
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            drawBlock(ctx, c * BLOCK, r * BLOCK, grid[r][c]);
          }
        }
      }

      // Draw ghost piece
      if (currentPiece) {
        let ghostY = currentPiece.y;
        while (!collide(currentPiece, 0, ghostY - currentPiece.y + 1)) {
          ghostY++;
        }
        for (let r = 0; r < currentPiece.shape.length; r++) {
          for (let c = 0; c < currentPiece.shape[r].length; c++) {
            if (currentPiece.shape[r][c]) {
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
              ctx.lineWidth = 1;
              ctx.strokeRect((currentPiece.x + c) * BLOCK + 1, (ghostY + r) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
            }
          }
        }

        // Draw active piece
        for (let r = 0; r < currentPiece.shape.length; r++) {
          for (let c = 0; c < currentPiece.shape[r].length; c++) {
            if (currentPiece.shape[r][c]) {
              drawBlock(ctx, (currentPiece.x + c) * BLOCK, (currentPiece.y + r) * BLOCK, currentPiece.color);
            }
          }
        }
      }
    }

    function drawBlock(c, x, y, color) {
      c.fillStyle = color;
      c.fillRect(x + 1, y + 1, BLOCK - 2, BLOCK - 2);
      c.fillStyle = 'rgba(255, 255, 255, 0.2)';
      c.fillRect(x + 1, y + 1, BLOCK - 2, 3);
      c.fillStyle = 'rgba(0, 0, 0, 0.2)';
      c.fillRect(x + 1, y + BLOCK - 4, BLOCK - 2, 3);
    }

    function drawNext() {
      nextCtx.fillStyle = '#0f172a';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextPiece) return;
      const pw = nextPiece.shape[0].length * 16;
      const ph = nextPiece.shape.length * 16;
      const offsetX = (nextCanvas.width - pw) / 2;
      const offsetY = (nextCanvas.height - ph) / 2;

      for (let r = 0; r < nextPiece.shape.length; r++) {
        for (let c = 0; c < nextPiece.shape[r].length; c++) {
          if (nextPiece.shape[r][c]) {
            nextCtx.fillStyle = nextPiece.color;
            nextCtx.fillRect(offsetX + c * 16 + 1, offsetY + r * 16 + 1, 14, 14);
          }
        }
      }
    }

    window.addEventListener('keydown', e => {
      if (!isPlaying || isGameOver) return;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) {
        if (!collide(currentPiece, -1, 0)) currentPiece.x--;
      } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
        if (!collide(currentPiece, 1, 0)) currentPiece.x++;
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        if (!collide(currentPiece, 0, 1)) { currentPiece.y++; score += 1; scoreEl.textContent = score; }
      } else if (['ArrowUp', 'KeyW'].includes(e.code)) {
        rotatePiece(currentPiece);
      } else if (e.code === 'Space') {
        hardDrop();
      }
    });

    document.getElementById('m-left').addEventListener('click', () => { if (isPlaying && !collide(currentPiece, -1, 0)) currentPiece.x--; });
    document.getElementById('m-right').addEventListener('click', () => { if (isPlaying && !collide(currentPiece, 1, 0)) currentPiece.x++; });
    document.getElementById('m-rot').addEventListener('click', () => { if (isPlaying) rotatePiece(currentPiece); });
    document.getElementById('m-drop').addEventListener('click', () => { if (isPlaying) hardDrop(); });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    draw();
  </script>
</body>
</html>
