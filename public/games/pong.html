<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 12px;
    }
    .player-tag {
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .score-big {
      font-size: 32px;
      font-weight: 800;
      color: #38bdf8;
    }
    .canvas-wrap {
      position: relative;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      background: #0f172a;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .title { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .tip {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div style="text-align: center;">
      <div class="player-tag">YOU</div>
      <div class="score-big" id="p1-score">0</div>
    </div>
    <div style="color: #64748b; font-weight: bold;">VS</div>
    <div style="text-align: center;">
      <div class="player-tag">CPU AI</div>
      <div class="score-big" id="p2-score">0</div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="480" height="340"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="overlay-msg">RETRO PONG</div>
      <button class="btn" id="start-btn">Start Match</button>
    </div>
  </div>

  <div class="tip">Move Mouse or Up/Down Arrows / W/S to control your paddle</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    const paddleH = 70;
    const paddleW = 10;

    let p1 = { y: 135, score: 0 };
    let p2 = { y: 135, score: 0 };
    let ball = { x: 240, y: 170, vx: 4, vy: 3, r: 6 };
    let isPlaying = false;
    let animId = null;

    function initGame() {
      p1.score = 0;
      p2.score = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      resetBall(1);
      overlay.classList.add('hidden');
      isPlaying = true;
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = (direction > 0 ? 4 : -4);
      ball.vy = (Math.random() * 4 - 2);
    }

    function loop() {
      update();
      draw();
      if (isPlaying) animId = requestAnimationFrame(loop);
    }

    function update() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / Bottom wall bounce
      if (ball.y - ball.r <= 0) {
        ball.y = ball.r;
        ball.vy = -ball.vy;
      } else if (ball.y + ball.r >= canvas.height) {
        ball.y = canvas.height - ball.r;
        ball.vy = -ball.vy;
      }

      // Player 1 Paddle Collision (Left)
      if (
        ball.x - ball.r <= 20 + paddleW &&
        ball.x + ball.r >= 20 &&
        ball.y >= p1.y &&
        ball.y <= p1.y + paddleH
      ) {
        ball.vx = Math.abs(ball.vx) * 1.05;
        const delta = (ball.y - (p1.y + paddleH / 2)) / (paddleH / 2);
        ball.vy = delta * 5;
      }

      // Player 2 AI Paddle Collision (Right)
      if (
        ball.x + ball.r >= canvas.width - 20 - paddleW &&
        ball.x - ball.r <= canvas.width - 20 &&
        ball.y >= p2.y &&
        ball.y <= p2.y + paddleH
      ) {
        ball.vx = -Math.abs(ball.vx) * 1.05;
        const delta = (ball.y - (p2.y + paddleH / 2)) / (paddleH / 2);
        ball.vy = delta * 5;
      }

      // AI movement
      const aiTarget = ball.y - paddleH / 2;
      p2.y += (aiTarget - p2.y) * 0.1;
      p2.y = Math.max(0, Math.min(canvas.height - paddleH, p2.y));

      // Scoring
      if (ball.x < 0) {
        p2.score++;
        p2ScoreEl.textContent = p2.score;
        if (p2.score >= 7) {
          endGame('CPU WINS!');
          return;
        }
        resetBall(1);
      } else if (ball.x > canvas.width) {
        p1.score++;
        p1ScoreEl.textContent = p1.score;
        if (p1.score >= 7) {
          endGame('YOU WIN!');
          return;
        }
        resetBall(-1);
      }
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(20, p1.y, paddleW, paddleH);

      // P2 Paddle
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 20 - paddleW, p2.y, paddleW, paddleH);

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function endGame(msg) {
      isPlaying = false;
      overlayMsg.textContent = msg;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeY = e.clientY - rect.top;
      p1.y = Math.max(0, Math.min(canvas.height - paddleH, relativeY - paddleH / 2));
    });

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) {
        p1.y = Math.max(0, p1.y - 25);
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        p1.y = Math.min(canvas.height - paddleH, p1.y + 25);
      }
    });

    startBtn.addEventListener('click', initGame);
    draw();
  </script>
</body>
</html>
