<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-badge {
      background: #1e293b;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 13px;
      font-weight: 600;
    }
    .canvas-wrap {
      position: relative;
      border: 2px solid #22c55e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(34, 197, 94, 0.15);
      background: #0f172a;
    }
    canvas {
      display: block;
      background: #0f172a;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .overlay-title { font-size: 28px; font-weight: 800; color: #22c55e; }
    .btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover { background: #16a34a; color: white; transform: scale(1.03); }
    .dpad {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 48px);
      gap: 6px;
    }
    .dbtn {
      width: 48px;
      height: 48px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .dbtn:active { background: #334155; }
    .tip {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand">SNAKE</div>
    <div class="scores">
      <div class="score-badge">Score: <span id="score">0</span></div>
      <div class="score-badge">Best: <span id="best">0</span></div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlay-msg">RETRO SNAKE</div>
      <p id="overlay-sub" style="font-size: 13px; color: #94a3b8;">Use Arrow keys or WASD to navigate</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <div class="dpad">
    <div></div>
    <button class="dbtn" id="up-btn">▲</button>
    <div></div>
    <button class="dbtn" id="left-btn">◀</button>
    <button class="dbtn" id="down-btn">▼</button>
    <button class="dbtn" id="right-btn">▶</button>
  </div>

  <div class="tip">Desktop: Arrows / WASD · Mobile: On-screen Pad</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COUNT = canvas.width / GRID;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 15 };
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = best;
    let gameLoop = null;
    let isRunning = false;
    let speed = 110;

    // Web Audio Synthesizer
    let audioCtx = null;
    function playBeep(freq, type = 'sine', dur = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 110;
      scoreEl.textContent = '0';
      spawnFood();
      overlay.classList.add('hidden');
      isRunning = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
      playBeep(440, 'triangle', 0.1);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function update() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snake_best', best);
        }
        playBeep(650, 'sine', 0.08);
        spawnFood();
        // Speed up slightly
        if (speed > 55 && score % 40 === 0) {
          speed -= 5;
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
        ctx.shadowColor = i === 0 ? '#4ade80' : 'transparent';
        ctx.shadowBlur = i === 0 ? 8 : 0;
        ctx.beginPath();
        ctx.roundRect(seg.x * GRID + 1.5, seg.y * GRID + 1.5, GRID - 3, GRID - 3, 4);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playBeep(180, 'sawtooth', 0.3);
      overlayMsg.textContent = 'GAME OVER';
      overlaySub.textContent = `You scored ${score} points!`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function setDirection(dx, dy) {
      if (!isRunning) return;
      if (dx !== 0 && dir.x !== 0) return; // Can't reverse
      if (dy !== 0 && dir.y !== 0) return;
      nextDir = { x: dx, y: dy };
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDirection(0, -1); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDirection(0, 1); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDirection(-1, 0); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDirection(1, 0); }
      if (e.code === 'Space' && !isRunning) initGame();
    });

    document.getElementById('up-btn').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('down-btn').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('left-btn').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('right-btn').addEventListener('click', () => setDirection(1, 0));
    startBtn.addEventListener('click', initGame);

    draw();
  </script>
</body>
</html>
