<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .hud-val { color: #38bdf8; font-size: 16px; }
    .game-wrap {
      position: relative;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      background: #050811;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 17, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .title { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .tip {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .mobile-bar {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 440px;
      justify-content: space-between;
    }
    .mbtn {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 12px 0;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span class="hud-val" id="score">0</span></div>
    <div>LIVES: <span class="hud-val" id="lives">🚀🚀🚀</span></div>
  </div>

  <div class="game-wrap">
    <canvas id="canvas" width="440" height="460"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="overlay-msg">SPACE DEFENDER</div>
      <button class="btn" id="start-btn">Launch Ship</button>
    </div>
  </div>

  <div class="mobile-bar">
    <button class="mbtn" id="m-left">◀ Left</button>
    <button class="mbtn" id="m-fire" style="background: #2563eb;">🔥 Fire</button>
    <button class="mbtn" id="m-right">Right ▶</button>
  </div>

  <div class="tip">Arrow Keys / A, D: Move · Spacebar: Fire Laser</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    let player = { x: 200, y: 420, w: 32, h: 20, speed: 5 };
    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let alienDir = 1;
    let alienSpeed = 1;
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let animId = null;
    let keys = {};
    let stars = [];

    // Init stars
    for (let i = 0; i < 45; i++) {
      stars.push({ x: Math.random() * 440, y: Math.random() * 460, s: Math.random() * 2 });
    }

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: 40 + c * 44,
            y: 40 + r * 34,
            w: 26,
            h: 18,
            alive: true,
            color: r === 0 ? '#ef4444' : r === 1 ? '#f97316' : '#22c55e'
          });
        }
      }
    }

    function initGame() {
      score = 0;
      lives = 3;
      alienSpeed = 1;
      scoreEl.textContent = '0';
      livesEl.textContent = '🚀🚀🚀';
      bullets = [];
      alienBullets = [];
      player.x = 200;
      initAliens();
      overlay.classList.add('hidden');
      isPlaying = true;
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    function shoot() {
      if (!isPlaying) return;
      if (bullets.length < 3) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10, vy: -7 });
      }
    }

    function loop() {
      update();
      draw();
      if (isPlaying) animId = requestAnimationFrame(loop);
    }

    function update() {
      // Player movement
      if (keys['ArrowLeft'] || keys['KeyA']) player.x = Math.max(10, player.x - player.speed);
      if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);

      // Stars twinkle
      stars.forEach(s => {
        s.y += 0.5;
        if (s.y > canvas.height) s.y = 0;
      });

      // Bullets
      bullets.forEach(b => b.y += b.vy);
      bullets = bullets.filter(b => b.y > -20);

      // Alien bullets
      alienBullets.forEach(b => b.y += b.vy);
      alienBullets = alienBullets.filter(b => b.y < canvas.height + 20);

      // Aliens movement
      let hitEdge = false;
      const aliveAliens = aliens.filter(a => a.alive);
      if (aliveAliens.length === 0) {
        score += 500;
        alienSpeed += 0.5;
        initAliens();
        return;
      }

      aliveAliens.forEach(a => {
        a.x += alienDir * alienSpeed;
        if (a.x <= 10 || a.x + a.w >= canvas.width - 10) hitEdge = true;
        if (a.y + a.h >= player.y) gameOver(false);
      });

      if (hitEdge) {
        alienDir *= -1;
        aliveAliens.forEach(a => a.y += 14);
      }

      // Random alien shooting
      if (Math.random() < 0.03 && aliveAliens.length > 0) {
        const shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
        alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 4, h: 8, vy: 4 });
      }

      // Bullet hit alien
      bullets.forEach(b => {
        aliveAliens.forEach(a => {
          if (b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y) {
            a.alive = false;
            b.y = -100;
            score += 20;
            scoreEl.textContent = score;
          }
        });
      });

      // Alien bullet hit player
      alienBullets.forEach(b => {
        if (b.x < player.x + player.w && b.x + b.w > player.x && b.y < player.y + player.h && b.y + b.h > player.y) {
          b.y = 1000;
          lives--;
          livesEl.textContent = '🚀'.repeat(Math.max(0, lives));
          if (lives <= 0) gameOver(false);
        }
      });
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#64748b';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.s, s.s);
      });

      // Player Ship
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      // Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Alien Bullets
      ctx.fillStyle = '#f43f5e';
      alienBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Aliens
      aliens.forEach(a => {
        if (!a.alive) return;
        ctx.fillStyle = a.color;
        ctx.fillRect(a.x, a.y, a.w, a.h);
        // Eyes
        ctx.fillStyle = '#050811';
        ctx.fillRect(a.x + 4, a.y + 4, 4, 4);
        ctx.fillRect(a.x + a.w - 8, a.y + 4, 4, 4);
      });
    }

    function gameOver(won) {
      isPlaying = false;
      overlayMsg.textContent = won ? 'VICTORY!' : 'GAME OVER';
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        shoot();
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    document.getElementById('m-left').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; });
    document.getElementById('m-left').addEventListener('touchend', () => keys['ArrowLeft'] = false);
    document.getElementById('m-right').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; });
    document.getElementById('m-right').addEventListener('touchend', () => keys['ArrowRight'] = false);
    document.getElementById('m-fire').addEventListener('click', shoot);

    startBtn.addEventListener('click', initGame);
    draw();
  </script>
</body>
</html>
