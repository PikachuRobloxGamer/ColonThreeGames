<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #334155;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .digital {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      color: #ef4444;
      background: #050811;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 800;
      min-width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .face-btn:active { transform: scale(0.95); }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 32px);
      grid-template-rows: repeat(9, 32px);
      gap: 2px;
      background: #334155;
      padding: 2px;
      border-radius: 6px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      border-radius: 2px;
    }
    .cell:hover { background: #64748b; }
    .cell.revealed {
      background: #0f172a;
      cursor: default;
    }
    .cell.c1 { color: #38bdf8; }
    .cell.c2 { color: #22c55e; }
    .cell.c3 { color: #ef4444; }
    .cell.c4 { color: #818cf8; }
    .cell.c5 { color: #f59e0b; }
    .cell.mine { background: #dc2626 !important; }
    .controls {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .mode-btn {
      background: #334155;
      border: 1px solid #475569;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <div class="digital" id="mines-left">010</div>
      <button class="face-btn" id="face-btn">🙂</button>
      <div class="digital" id="timer">000</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="controls">
      <span>Left-click: Dig · Right-click: Flag</span>
      <button class="mode-btn" id="flag-mode-btn">🚩 Flag Mode: OFF</button>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const TOTAL_MINES = 10;

    let board = [];
    let revealedCount = 0;
    let flags = 0;
    let timer = 0;
    let timerId = null;
    let gameOver = false;
    let flagMode = false;

    const gridEl = document.getElementById('grid');
    const minesLeftEl = document.getElementById('mines-left');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face-btn');
    const flagModeBtn = document.getElementById('flag-mode-btn');

    flagModeBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagModeBtn.textContent = flagMode ? '🚩 Flag Mode: ON' : '🚩 Flag Mode: OFF';
      flagModeBtn.classList.toggle('active', flagMode);
    });

    function init() {
      board = [];
      revealedCount = 0;
      flags = 0;
      timer = 0;
      gameOver = false;
      clearInterval(timerId);
      timerId = null;
      timerEl.textContent = '000';
      minesLeftEl.textContent = String(TOTAL_MINES).padStart(3, '0');
      faceBtn.textContent = '🙂';

      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          const el = document.createElement('div');
          el.className = 'cell';
          el.dataset.r = r;
          el.dataset.c = c;
          gridEl.appendChild(el);

          board[r][c] = {
            mine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el
          };

          el.addEventListener('click', () => {
            if (flagMode) toggleFlag(r, c);
            else clickCell(r, c);
          });
          el.addEventListener('contextmenu', e => {
            e.preventDefault();
            toggleFlag(r, c);
          });
        }
      }

      // Plant mines
      let planted = 0;
      while (planted < TOTAL_MINES) {
        const rr = Math.floor(Math.random() * ROWS);
        const cc = Math.floor(Math.random() * COLS);
        if (!board[rr][cc].mine) {
          board[rr][cc].mine = true;
          planted++;
        }
      }

      // Calculate adjacent mine counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function startTimer() {
      if (!timerId) {
        timerId = setInterval(() => {
          timer++;
          timerEl.textContent = String(Math.min(999, timer)).padStart(3, '0');
        }, 1000);
      }
    }

    function clickCell(r, c) {
      if (gameOver) return;
      startTimer();
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      if (cell.mine) {
        // Mine hit
        gameOver = true;
        clearInterval(timerId);
        faceBtn.textContent = '😵';
        revealAllMines();
        cell.el.classList.add('mine');
        return;
      }

      revealCell(r, c);

      if (revealedCount === ROWS * COLS - TOTAL_MINES) {
        gameOver = true;
        clearInterval(timerId);
        faceBtn.textContent = '😎';
      }
    }

    function revealCell(r, c) {
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true;
      revealedCount++;
      cell.el.classList.add('revealed');

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add(`c${cell.count}`);
      } else {
        // Flood fill 0 neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      cell.el.textContent = cell.flagged ? '🚩' : '';
      flags += cell.flagged ? 1 : -1;
      minesLeftEl.textContent = String(Math.max(0, TOTAL_MINES - flags)).padStart(3, '0');
    }

    function revealAllMines() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) {
            board[r][c].el.textContent = '💣';
            board[r][c].el.classList.add('revealed');
          }
        }
      }
    }

    faceBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
